<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Brick Shooter</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="game"></div>

<div id="hud" class="hidden">
  <div class="col">
    <div id="hits"></div>
    <div id="ammo">
      <div id="ammoPips"></div>
      <div id="reloadBar"><div></div></div>
      <span class="lbl">RELOAD</span>
    </div>
  </div>
  <div class="row">
    <div id="room"></div>
    <button id="pauseBtn" aria-label="暫停">❚❚</button>
  </div>
</div>
<div id="toast"></div>
<div id="flash"></div>
<div id="fade"></div>

<div id="sticks">
  <div class="stick" id="stickL"><div class="knob"></div></div>
  <div class="stick" id="stickR"><div class="ring"></div><div class="knob"></div></div>
</div>

<!-- 進入畫面：按鈕由 main.js 的 MENU_ITEMS 產生，之後加功能只要加一筆 -->
<div id="menu" class="screen">
  <div class="menu-inner">
    <h1>BRICK<br>SHOOTER</h1>
    <p class="tag">方塊人俯視射擊</p>
    <div id="menuButtons"></div>
    <p class="ver">v0.2</p>
  </div>
</div>

<!-- 通用面板：暫停、死亡、說明、任務完成 -->
<div id="panel" class="screen hidden">
  <div class="panel-inner">
    <h2 id="panelTitle"></h2>
    <div id="panelText"></div>
    <div id="panelButtons"></div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
